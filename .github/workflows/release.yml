name: Release

on:
  push:
    tags: ["v*"]
  # Disparo pelo auto-release: tag criada com GITHUB_TOKEN não gera evento de push.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente a publicar (ex.: v0.1.12)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Release só sai se o scan de segurança passar no código da tag.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  dist:
    name: ${{ matrix.name }}
    needs: security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg x64 + arm64)
            os: macos-latest
            artifacts: app/release/*.dmg
          - name: Windows (nsis)
            os: windows-latest
            artifacts: app/release/*.exe
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # A tag é a fonte da versão. O auto-release não faz commit de bump no main.
      - name: Versão a partir da tag
        shell: bash
        run: pnpm pkg set "version=${TAG#v}"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Dist (electron-vite build + electron-builder)
        run: pnpm dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem assinatura por enquanto. Não procura certificado no Keychain do runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Quando houver certificado, adicione os secrets e remova a linha acima:
          #   CSC_LINK: ${{ secrets.CSC_LINK }}                 # .p12 em base64 (mac Developer ID ou win Authenticode)
          #   CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarização mac (exige `notarize: true` no electron-builder.yml):
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check native bindings (mac)
        # Cada .app precisa do keyring-darwin-<arch> da própria CPU.
        if: runner.os == 'macOS'
        run: pnpm check:native

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v7
        with:
          name: multishell-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          tag_name: ${{ env.TAG }}
          name: Multishell ${{ env.TAG }}
          body: Veja os commits desde a tag anterior para detalhes.
          files: ${{ matrix.artifacts }}
