allowBuilds:
  electron-winstaller: true
  esbuild: true
  node-pty: true

# O electron-builder gera o DMG x64 e o arm64 a partir do mesmo node_modules.
# Pacotes nativos por plataforma (ex.: @napi-rs/keyring-darwin-*) só entram se o pnpm
# instalar as duas CPUs; senão um dos DMGs quebra com "Cannot find native binding".
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]

# Versões corrigidas publicadas há menos tempo que o minimumReleaseAge do pnpm.
# Gerado por `pnpm audit --fix update`. Pode sair depois que essas versões envelhecerem.
minimumReleaseAgeExclude:
  - fast-uri@3.1.8
  - brace-expansion@1.1.19
  - brace-expansion@1.1.20
  - brace-expansion@1.1.21
  - brace-expansion@2.1.5
  - brace-expansion@2.1.6
  - brace-expansion@2.1.7
  - brace-expansion@5.0.10
  - brace-expansion@5.0.11
  - brace-expansion@5.0.12
  - http-cache-semantics@4.2.1
  - source-map-js@1.2.2
